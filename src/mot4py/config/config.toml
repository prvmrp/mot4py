[Board.DO1]
desc = "Digital Output Board #1"
type = "DO16"
address = 3

[Board.AO1]
desc = "Analog Output Board #1"
type = "AO8"
address = 24
opts = {vmin = -12.288, vmax = 12.288}

[Board.DDS1]
desc = "RF Lock DDS"
type = "RF9958LIN"
address = 40
opts = {A = [8.5e6,  8.5e6], B = [50.0, 100.0]}

#default A = 60 MHz, B=1kHz
[Board.DDS2]
desc = "AOM DDS"
type = "RF9958LIN"
opts = {A = [60.0e6,  60.0e6], B = [1000.0, 1000.0]}
address = 36

#IDs
# BRD_Channel
# _rng is replaced by the first range, with IDs given by the second range
[ID]
DO1_rng = [[0, 15], [0, 15]]
AO1_rng = [[0,7], [20, 27]]

DDS1_F0 = 30
DDS1_A0 = 31
DDS1_F1 = 32
DDS1_A1 = 33

# _lst is replaced by the first list, with IDs given by the second range
DDS2_lst = [['F0', 'A0', 'F1', 'A1'], [40, 43]]

#Functions -> [bus.board.channel]
#bus types so far:
#SPB real time bus
#USB, ETH, SER via PyVISA
#EPICS

