[Board.DO1]
desc = "Digital Output Board #1"
type = "DO16"
address = 1

[Board.AO1]
desc = "Analog Output Board #1"
type = "AO8"
address = 8
opts = {vmin = -12.228, vmax = 12.228}

[Board.AO2]
desc = "Analog Output Board #1"
type = "AO8"
address = 12
opts = {vmin = -12.228, vmax = 12.228}


[Board.DDS1]
desc = "RF Lock DDS"
type = "RF9958LIN"
address = 32
opts = {A = [8.5e6,  8.5e6], B = [50.0, 50.0]}

#default A = 60 MHz, B=1kHz
[Board.DDS2]
desc = "AOM DDS"
type = "RF9958LIN"
address = 36

#IDs
# BRD_Channel
# _rng is replaced by the first range, with IDs given by the second range
[ID]
DO1_rng = [[0, 15], [0, 15]]
AO1_rng = [[0,7], [20, 27]]

DDS1_F0 = 30
DDS1_A0 = 31
DDS1_F1 = 32
DDS1_A1 = 33

# _lst is replaced by the first list, with IDs given by the second range
DDS2_lst = [['F0', 'A0', 'F1', 'A1'], [40, 43]]

#Functions -> [bus.board.channel]
#bus types so far:
#SPB real time bus
#USB, ETH, SER via PyVISA
#EPICS

[SPB.DO1_14]
desc = 'MOT B Field'
type = 'Binary'
id = 'DO1_14'

[SPB.DO1_0]
desc = 'Trigger'
type = 'Binary'
id = 'DO1_0'

[SPB.AO1_2]
desc = 'Mot B Current'
type = 'Scalar'
id = 'AO1_2'
min = 0.0
max = 20.0
fmt = '%.3f'
units = 'A'
compile = 'cAO1_2'

[SPB.DDS1_F0]
desc = 'Ref Cooler Lock Freq'
type = 'Scalar'
id = 'DDS1_F0'
min = 8.5e6
max = 11.5e6
fmt = '%.5f'
units = 'Hz'

[SPB.DDS1_A0]
desc = 'Ref Cooler Amp'
type = 'Enum'
id = 'DDS1_A0'
min = 0
max = 1024


